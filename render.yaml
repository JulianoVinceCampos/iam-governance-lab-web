# Blueprint de deploy no Render (https://render.com).
# New -> Blueprint -> aponta para o repositório. O Render builda o Dockerfile, cria o disco
# em /data e entrega um DNS *.onrender.com com TLS automático.

services:
  - type: web
    name: iam-governance-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: IAMGOV_DB_PATH
        value: /data/iamgov.db
      - key: IAMGOV_DATA_DIR
        value: /app/data
      - key: DEMO_RESET_MINUTES
        value: "60"
      # Para proteger a edição e deixar só a leitura pública, defina os dois:
      # - key: IAMGOV_AUTH_USER
      #   sync: false
      # - key: IAMGOV_AUTH_PASS
      #   sync: false
    disk:
      name: iamgov-data
      mountPath: /data
      sizeGB: 1
