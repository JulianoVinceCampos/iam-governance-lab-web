name: codeql

# Análise estática nativa do GitHub (CodeQL). Complementa o Semgrep do ci.yml e publica os
# achados na aba Security do repositório. Roda em push/PR na main e num schedule semanal, para
# pegar regra nova de segurança mesmo sem commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
