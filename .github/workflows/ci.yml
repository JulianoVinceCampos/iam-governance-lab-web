name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Types (mypy strict)
        run: python -m mypy

      - name: Tests (pytest)
        run: python -m pytest

      - name: Validate the shipped dataset
        run: python -m iamgov.cli validate --data data

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (projeto + ferramentas de segurança)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
          python -m pip install pip-audit semgrep

      - name: Dependency audit (pip-audit)
        # Falha se alguma dependência instalada tiver CVE conhecido. O fix é um bump de versão,
        # e o Dependabot abre o PR sozinho.
        run: python -m pip_audit --strict --progress-spinner off

      - name: SAST (semgrep)
        # Análise estática do nosso código com rulesets públicos do registry, sem token.
        run: semgrep scan --config p/python --config p/security-audit --error --quiet src

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t iam-governance-lab:ci .
      - name: Boot it and hit the health endpoint
        run: |
          docker run -d --name iamgov -p 8000:8000 iam-governance-lab:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs iamgov
          test "${ok:-0}" = "1"

  publish:
    needs: [check, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        # GHCR exige owner/repo em minúsculas; github.repository pode ter maiúsculas.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
